# Kamailio NOC — incluir dentro del bloque server{} HTTPS de nginx.
# Acceso SOLO por HTTPS; la app gestiona login/sesiones (sin basic-auth).
# __NOC_PORT__ lo reemplaza install.sh (por defecto 8899).
location = /noc { return 301 https://$host/noc/; }
location /noc/ {
    if ($scheme != "https") { return 301 https://$host$request_uri; }
    proxy_pass http://127.0.0.1:__NOC_PORT__/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /noc;
    proxy_read_timeout 15s;
}
